[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-reasoning-agents"
version = "1.0.0"
description = "Production-grade multi-step reasoning agents using LangGraph and custom sentence-transformers RAG memory backed by distributed RQ async workers."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "AI & ML Engineering Team", email = "mle@enterprise.com"}
]
keywords = ["langgraph", "rag", "agents", "redis", "rq", "sentence-transformers", "aws", "async"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "langgraph>=0.0.30",
    "langchain-core>=0.1.30",
    "redis>=5.0.0",
    "rq>=1.16.0",
    "sentence-transformers>=2.6.0",
    "numpy>=1.26.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pypdf>=4.1.0",
    "openpyxl>=3.1.2",
    "python-pptx>=0.6.23",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
